syntax = "proto3";
option optimize_for = LITE_RUNTIME;
/* Java包字段:Java编译时使用 */
option java_package = "com.message_aux.nanopb";
option java_outer_classname = "AppPB_MsgFileAux";
/* 依赖包 */
import "nanopb.proto";

/* 辅助应答消息 */
message AppPB_ACK {
    /* 当次应答错误码 */
    enum ErrorCode {
        SUCCEED     = 0x00;     //无错误,应答成功
        CRC_FAILED  = 0x01;     //CRC校验失败
        CHK_FAILED  = 0x02;     //CheckSum校验失败
    }
    
    ErrorCode  error_code = 1;                                     //当次应答错误码
    uint64     type       = 2 [(nanopb).int_size = IS_16];         //应答消息类型:小协议=MsgSet oneof tag;文件=File子消息tag(descriptor=1/package=2/done=3)
    uint64     index      = 3 [(nanopb).int_size = IS_16];         //应答对象索引(文件分包拉取游标/重传索引),非文件默认0
}

/* 传输日志消息 */
/* 追踪日志消息文本最大限制 APP_MODULE_TRACE_TEXT_MAX + 1 */
message AppPB_TraceTxt {
    string  trace_text = 1 [(nanopb).max_size = 129];  //单条传输文本消息
}
